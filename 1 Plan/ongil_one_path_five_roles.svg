<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">보호자, 치료사, 특수교사, 사회복지사, 활동지원사 각자의 색을 지나 당사자의 색으로 도착하는 하나의 연속된 곡선 경로로 구성된 로고 컨셉, 다크·라이트 배경 두 가지로 제시</desc>

