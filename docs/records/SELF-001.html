<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SELF-001 — 자기표현 서식 | 온길</title>
<style>

:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: #F7F8FA;
  color: #1F2937;
  line-height: 1.5;
}
.page { max-width: 1400px; margin: 0 auto; padding: 32px 24px 80px; }
.back-link { display: inline-block; margin-bottom: 16px; color: #6B7280; text-decoration: none; font-size: 14px; }
.back-link:hover { text-decoration: underline; }
.header-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.domain-badge {
  background: #FFF8E1; color: #8A6D1D; border: 1px solid #D9A62E33;
  padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
}
.type-code { font-family: ui-monospace, monospace; font-size: 13px; color: #9CA3AF; }
.confirm-badge { background: #FEF3C7; color: #92400E; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.draft-badge { background: #F3F4F6; color: #6B7280; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
h1 { font-size: 26px; margin: 4px 0; }
.subtitle { color: #6B7280; margin: 0 0 24px; font-size: 15px; }

.record-form {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 24px;
  align-items: start;
}
.card {
  background: #fff;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.card legend { font-weight: 700; font-size: 16px; padding: 0 6px; }

.field { margin: 20px 0; }
.field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #374151; }
.req { color: #DC2626; }
.hint { font-size: 12px; color: #9CA3AF; margin: 4px 0 0; }

input[type="text"], input[type="date"], input[type="time"], input[type="datetime-local"],
input[type="number"], select, textarea {
  width: 100%;
  border: 1px solid #D1D5DB;
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  background: #fff;
  color: #1F2937;
}
textarea { resize: vertical; }

.choice-group { display: flex; flex-wrap: wrap; gap: 8px; }
.choice-tile {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid #D1D5DB; border-radius: 10px;
  padding: 10px 14px; cursor: pointer; font-size: 14px;
  min-height: 44px;
}
.choice-tile .emoji { font-size: 18px; }
.choice-tile input { margin: 0; }

.subgroup { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.inline-field label { font-size: 13px; font-weight: 500; color: #4B5563; margin-bottom: 4px; display: block; }

.period-row { display: flex; align-items: center; gap: 8px; }
.period-row .tilde { color: #9CA3AF; }

.tag-cat { margin-bottom: 10px; }
.tag-cat-label { font-size: 12px; color: #9CA3AF; display: block; margin-bottom: 4px; }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-chip {
  border: 1px solid #D1D5DB; background: #fff; border-radius: 999px;
  padding: 6px 12px; font-size: 13px; cursor: pointer;
}

.repeat-list { display: flex; flex-direction: column; gap: 8px; }
.repeat-row { display: flex; gap: 8px; }
.repeat-row input { flex: 1; }
.btn-remove { border: none; background: #F3F4F6; color: #6B7280; border-radius: 6px; width: 32px; cursor: pointer; }
.btn-add {
  align-self: flex-start; border: 1px dashed #9CA3AF; background: none; color: #6B7280;
  border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; margin-top: 6px;
}

.repeat-table-wrap { overflow-x: auto; }
.repeat-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
.repeat-table th { text-align: left; font-size: 12px; color: #6B7280; padding: 6px 8px; border-bottom: 1px solid #E5E7EB; white-space: nowrap; }
.repeat-table td { padding: 6px; vertical-align: top; }
.repeat-table td input, .repeat-table td select, .repeat-table td textarea { min-width: 110px; }
.col-action { width: 36px; }

.sidebar { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 24px; }
.banner { border: 1px solid; border-radius: 12px; padding: 16px; font-size: 13px; }
.banner strong { display: block; margin-bottom: 6px; font-size: 15px; }
.banner p { margin: 4px 0; }
.age-guard { font-weight: 600; }

.target-person { background: #fff; border: 1px solid #E5E7EB; border-radius: 12px; padding: 16px; }

.action-card { background: #fff; border: 1px solid #E5E7EB; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.btn-save { background: #D9A62E; color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
.btn-cancel { background: none; border: 1px solid #D1D5DB; color: #4B5563; border-radius: 8px; padding: 10px; font-size: 14px; cursor: pointer; }

.meta-card { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 12px; padding: 14px; font-size: 12px; color: #6B7280; }
.meta-card p { margin: 4px 0; }
.meta-card strong { color: #374151; }

@media (max-width: 900px) {
  .record-form { grid-template-columns: 1fr; }
  .sidebar { position: static; }
  .subgroup { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <a class="back-link" href="./index.html">← 기록 서식 목록</a>
      <div class="header-row">
        <span class="domain-badge">자기표현</span>
        <span class="type-code">SELF-001</span>
        <span class="draft-badge">일상 기록(확인절차 없음)</span>
      </div>
      <h1>자기표현</h1>
      <p class="subtitle">당사자 본인이 매일 남기는 기분·식사·건강·활동 기록</p>
    </header>

    <form class="record-form">
      <div class="left-col">
        <fieldset class="card">
          <legend>기본 정보 및 서식 필드</legend>
          
        <div class="field">
          <label>오늘 기분 <span class="req">*</span></label>
          <div class="choice-group" role="radiogroup"><label class="choice-tile"><input type="radio" name="mood" value="good" /><span class="emoji">😊</span><span>좋아요</span></label><label class="choice-tile"><input type="radio" name="mood" value="neutral" /><span class="emoji">😐</span><span>보통이에요</span></label><label class="choice-tile"><input type="radio" name="mood" value="sad" /><span class="emoji">😢</span><span>슬퍼요</span></label><label class="choice-tile"><input type="radio" name="mood" value="angry" /><span class="emoji">😠</span><span>화나요</span></label></div>
          
        </div>

        <div class="field">
          <label>식사 <span class="req">*</span></label>
          <div class="choice-group" role="radiogroup"><label class="choice-tile"><input type="radio" name="meal" value="full" /><span class="emoji">🍚</span><span>다 먹었어요</span></label><label class="choice-tile"><input type="radio" name="meal" value="partial" /><span class="emoji">🥄</span><span>조금 먹었어요</span></label><label class="choice-tile"><input type="radio" name="meal" value="none" /><span class="emoji">🚫</span><span>안 먹었어요</span></label></div>
          
        </div>

        <div class="field">
          <label>식사 사진</label>
          <input type="text" placeholder="이미지 업로드(선택)" maxlength="" />
          
        </div>

        <div class="field">
          <label>오늘 한 활동</label>
          <div class="choice-group"><label class="choice-tile"><input type="checkbox" name="activities" value="exercise" /><span class="emoji">🏃</span><span>운동</span></label><label class="choice-tile"><input type="checkbox" name="activities" value="study" /><span class="emoji">📚</span><span>학습</span></label><label class="choice-tile"><input type="checkbox" name="activities" value="craft" /><span class="emoji">🎨</span><span>만들기</span></label><label class="choice-tile"><input type="checkbox" name="activities" value="social" /><span class="emoji">🤝</span><span>친구와 놀기</span></label></div>
          
        </div>

        <div class="field">
          <label>건강 상태 <span class="req">*</span></label>
          <div class="choice-group" role="radiogroup"><label class="choice-tile"><input type="radio" name="health" value="good" /><span class="emoji">💪</span><span>건강해요</span></label><label class="choice-tile"><input type="radio" name="health" value="sick" /><span class="emoji">🤒</span><span>아파요</span></label><label class="choice-tile"><input type="radio" name="health" value="tired" /><span class="emoji">😴</span><span>피곤해요</span></label></div>
          
        </div>

        <div class="field">
          <label>메모 (최대 1000자)</label>
          <textarea rows="3" placeholder="" maxlength="1000"></textarea>
          
        </div>

        <div class="field">
          <label>음성 메모</label>
          <input type="text" placeholder="녹음 파일(선택)" maxlength="" />
          
        </div>
        </fieldset>
      </div>

      <aside class="sidebar">
        <div class="banner" style="background:#FFF8E1;color:#8A6D1D;border-color:#D9A62E">
          <strong>SELF-001 · 자기표현</strong>
          <p>주 작성자: 당사자 본인(보호자 대리 작성 가능)</p>
          
          <p>일상 기록으로, 별도 확인 절차 없이 즉시 저장됩니다.</p>
        </div>

        <div class="field target-person">
          <label>제출 대상</label>
          <select><option>당사자를 선택하세요</option></select>
        </div>

        <div class="action-card">
          <button type="button" class="btn-save">저장</button>
          <button type="button" class="btn-cancel">취소</button>
        </div>

        <div class="meta-card">
          <p><strong>연결 화면</strong> P-02 / G-22</p>
          <p><strong>스키마 출처</strong> packages/validation/src/records.ts</p>
        </div>
      </aside>
    </form>
  </div>
</body>
</html>
