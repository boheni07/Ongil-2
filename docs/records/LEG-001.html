<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LEG-001 — 후견감독보고서 서식 | 온길</title>
<style>

:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: #F7F8FA;
  color: #1F2937;
  line-height: 1.5;
}
.page { max-width: 1400px; margin: 0 auto; padding: 32px 24px 80px; }
.back-link { display: inline-block; margin-bottom: 16px; color: #6B7280; text-decoration: none; font-size: 14px; }
.back-link:hover { text-decoration: underline; }
.header-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.domain-badge {
  background: #EEF2F7; color: #3E5E7A; border: 1px solid #5A7FA033;
  padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
}
.type-code { font-family: ui-monospace, monospace; font-size: 13px; color: #9CA3AF; }
.confirm-badge { background: #FEF3C7; color: #92400E; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.draft-badge { background: #F3F4F6; color: #6B7280; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
h1 { font-size: 26px; margin: 4px 0; }
.subtitle { color: #6B7280; margin: 0 0 24px; font-size: 15px; }

.record-form {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 24px;
  align-items: start;
}
.card {
  background: #fff;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.card legend { font-weight: 700; font-size: 16px; padding: 0 6px; }

.field { margin: 20px 0; }
.field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #374151; }
.req { color: #DC2626; }
.hint { font-size: 12px; color: #9CA3AF; margin: 4px 0 0; }

input[type="text"], input[type="date"], input[type="time"], input[type="datetime-local"],
input[type="number"], select, textarea {
  width: 100%;
  border: 1px solid #D1D5DB;
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  background: #fff;
  color: #1F2937;
}
textarea { resize: vertical; }

.choice-group { display: flex; flex-wrap: wrap; gap: 8px; }
.choice-tile {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid #D1D5DB; border-radius: 10px;
  padding: 10px 14px; cursor: pointer; font-size: 14px;
  min-height: 44px;
}
.choice-tile .emoji { font-size: 18px; }
.choice-tile input { margin: 0; }

.subgroup { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.inline-field label { font-size: 13px; font-weight: 500; color: #4B5563; margin-bottom: 4px; display: block; }

.period-row { display: flex; align-items: center; gap: 8px; }
.period-row .tilde { color: #9CA3AF; }

.tag-cat { margin-bottom: 10px; }
.tag-cat-label { font-size: 12px; color: #9CA3AF; display: block; margin-bottom: 4px; }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-chip {
  border: 1px solid #D1D5DB; background: #fff; border-radius: 999px;
  padding: 6px 12px; font-size: 13px; cursor: pointer;
}

.repeat-list { display: flex; flex-direction: column; gap: 8px; }
.repeat-row { display: flex; gap: 8px; }
.repeat-row input { flex: 1; }
.btn-remove { border: none; background: #F3F4F6; color: #6B7280; border-radius: 6px; width: 32px; cursor: pointer; }
.btn-add {
  align-self: flex-start; border: 1px dashed #9CA3AF; background: none; color: #6B7280;
  border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; margin-top: 6px;
}

.repeat-table-wrap { overflow-x: auto; }
.repeat-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
.repeat-table th { text-align: left; font-size: 12px; color: #6B7280; padding: 6px 8px; border-bottom: 1px solid #E5E7EB; white-space: nowrap; }
.repeat-table td { padding: 6px; vertical-align: top; }
.repeat-table td input, .repeat-table td select, .repeat-table td textarea { min-width: 110px; }
.col-action { width: 36px; }

.sidebar { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 24px; }
.banner { border: 1px solid; border-radius: 12px; padding: 16px; font-size: 13px; }
.banner strong { display: block; margin-bottom: 6px; font-size: 15px; }
.banner p { margin: 4px 0; }
.age-guard { font-weight: 600; }

.target-person { background: #fff; border: 1px solid #E5E7EB; border-radius: 12px; padding: 16px; }

.action-card { background: #fff; border: 1px solid #E5E7EB; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.btn-save { background: #D9A62E; color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
.btn-cancel { background: none; border: 1px solid #D1D5DB; color: #4B5563; border-radius: 8px; padding: 10px; font-size: 14px; cursor: pointer; }

.meta-card { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 12px; padding: 14px; font-size: 12px; color: #6B7280; }
.meta-card p { margin: 4px 0; }
.meta-card strong { color: #374151; }

@media (max-width: 900px) {
  .record-form { grid-template-columns: 1fr; }
  .sidebar { position: static; }
  .subgroup { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <a class="back-link" href="./index.html">← 기록 서식 목록</a>
      <div class="header-row">
        <span class="domain-badge">법률·권리</span>
        <span class="type-code">LEG-001</span>
        <span class="confirm-badge">확인절차 필요</span>
      </div>
      <h1>후견감독보고서</h1>
      <p class="subtitle">사회복지사가 지원하는 성년후견인의 법원 제출용 정기보고</p>
    </header>

    <form class="record-form">
      <div class="left-col">
        <fieldset class="card">
          <legend>기본 정보 및 서식 필드</legend>
          
        <div class="field">
          <label>보고 구분 <span class="req">*</span></label>
          <div class="choice-group" role="radiogroup"><label class="choice-tile"><input type="radio" name="report_kind" value="initial" /><span>최초 보고 (재산목록보고)</span></label><label class="choice-tile"><input type="radio" name="report_kind" value="periodic" /><span>정기 보고</span></label></div>
          
        </div>

        <div class="field">
          <label>보고 기간 <span class="req">*</span></label>
          <div class="period-row"><input type="date" /><span class="tilde">~</span><input type="date" /></div>
          
        </div>

        <div class="field">
          <label>후견 유형 <span class="req">*</span></label>
          <div class="choice-group" role="radiogroup"><label class="choice-tile"><input type="radio" name="guardian_type" value="adult" /><span>성년후견</span></label><label class="choice-tile"><input type="radio" name="guardian_type" value="limited" /><span>한정후견</span></label><label class="choice-tile"><input type="radio" name="guardian_type" value="specific" /><span>특정후견</span></label><label class="choice-tile"><input type="radio" name="guardian_type" value="voluntary" /><span>임의후견</span></label></div>
          
        </div>

        <div class="field">
          <label>후견인 성명 <span class="req">*</span></label>
          <input type="text" placeholder="" maxlength="" />
          
        </div>

        <div class="field">
          <label>재산관리 현황 (최대 3000자) <span class="req">*</span></label>
          <textarea rows="5" placeholder="" maxlength="3000"></textarea>
          
        </div>

        <div class="field">
          <label>신상보호 현황 (최대 3000자) <span class="req">*</span></label>
          <textarea rows="5" placeholder="" maxlength="3000"></textarea>
          
        </div>

        <div class="field">
          <label>특이사항 (최대 2000자, 선택)</label>
          <textarea rows="3" placeholder="" maxlength="2000"></textarea>
          
        </div>

        <div class="field">
          <label>다음 보고 예정일 <span class="req">*</span></label>
          <input type="date" />
          
        </div>
        </fieldset>
      </div>

      <aside class="sidebar">
        <div class="banner" style="background:#EEF2F7;color:#3E5E7A;border-color:#5A7FA0">
          <strong>LEG-001 · 후견감독보고서</strong>
          <p>주 작성자: 사회복지사</p>
          <p class="age-guard">⚠ 성인기·노년기(만 19세 이상)만 작성 가능</p>
          <p>제출 시 확인 주체(성년=본인, 미성년=주보호자)가 자동 지정되어 확인 요청 알림이 발송됩니다.</p>
        </div>

        <div class="field target-person">
          <label>제출 대상</label>
          <select><option>당사자를 선택하세요</option></select>
        </div>

        <div class="action-card">
          <button type="button" class="btn-save">저장</button>
          <button type="button" class="btn-cancel">취소</button>
        </div>

        <div class="meta-card">
          <p><strong>연결 화면</strong> W-19</p>
          <p><strong>스키마 출처</strong> packages/validation/src/records.ts</p>
        </div>
      </aside>
    </form>
  </div>
</body>
</html>
